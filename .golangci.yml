version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocheckcompilerdirectives
    - modernize
    - nolintlint
    - gocritic

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

run:
  timeout: 5m
  tests: true
